<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" role="img" aria-labelledby="tc">
<title id="tc">Centinela-WP — plugin de seguridad todo en uno para WordPress</title>

<defs>
<linearGradient id="banda" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
  <stop offset=".5" stop-color="#00E5FF" stop-opacity=".55"/>
  <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
</linearGradient>
<linearGradient id="top" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0" stop-color="#00E5FF"/>
  <stop offset="1" stop-color="#B026FF"/>
</linearGradient>
<clipPath id="mc"><rect width="1200" height="340" rx="20"/></clipPath>
<clipPath id="rejilla"><rect x="740" y="86" width="258" height="150"/></clipPath>
</defs>

<style>
.d{font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif}
.m{font-family:ui-monospace,'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace}
.b{fill:#16161F;stroke:#ffffff;stroke-opacity:.07;stroke-width:1}
.ok{animation:ok .5s ease forwards}
@keyframes ok{to{fill:#0E1E24;stroke:#00E5FF;stroke-opacity:.7}}
.mal{animation:mal .5s ease forwards}
@keyframes mal{to{fill:#2A0E18;stroke:#FF3B6B;stroke-opacity:1}}
</style>

<g clip-path="url(#mc)">
<rect width="1200" height="340" fill="#07070C"/>
<rect width="1200" height="3" fill="url(#top)"/>

<text class="m" x="72" y="112" font-size="12.5" letter-spacing="2.2" fill="#00E5FF">SEGURIDAD PARA WORDPRESS</text>
<text class="d" x="72" y="186" font-size="64" font-weight="700" letter-spacing="-2" fill="#F2F0FF">Centinela<tspan fill="#B026FF">-WP</tspan></text>
<text class="d" x="72" y="228" font-size="18" fill="#6A6A85">Antivirus, cortafuegos, doble factor y copias de seguridad</text>
<text class="m" x="72" y="256" font-size="12.5" fill="#4E4E63">un solo plugin · seis modos de escaneo</text>

<g clip-path="url(#rejilla)">
<g class="b">
<rect x="760" y="90" width="28" height="28" rx="6"/><rect x="798" y="90" width="28" height="28" rx="6"/><rect x="836" y="90" width="28" height="28" rx="6"/><rect x="874" y="90" width="28" height="28" rx="6"/><rect x="912" y="90" width="28" height="28" rx="6"/><rect x="950" y="90" width="28" height="28" rx="6"/>
<rect x="760" y="128" width="28" height="28" rx="6"/><rect x="798" y="128" width="28" height="28" rx="6"/><rect class="mal" style="animation-delay:1.5s" x="836" y="128" width="28" height="28" rx="6"/><rect x="874" y="128" width="28" height="28" rx="6"/><rect x="912" y="128" width="28" height="28" rx="6"/><rect x="950" y="128" width="28" height="28" rx="6"/>
<rect x="760" y="166" width="28" height="28" rx="6"/><rect x="798" y="166" width="28" height="28" rx="6"/><rect x="836" y="166" width="28" height="28" rx="6"/><rect x="874" y="166" width="28" height="28" rx="6"/><rect x="912" y="166" width="28" height="28" rx="6"/><rect x="950" y="166" width="28" height="28" rx="6"/>
<rect x="760" y="204" width="28" height="28" rx="6"/><rect class="ok" style="animation-delay:0.9s" x="798" y="204" width="28" height="28" rx="6"/><rect x="836" y="204" width="28" height="28" rx="6"/><rect x="874" y="204" width="28" height="28" rx="6"/><rect class="mal" style="animation-delay:2.6s" x="912" y="204" width="28" height="28" rx="6"/><rect x="950" y="204" width="28" height="28" rx="6"/>
</g>
<rect x="-40" y="86" width="40" height="150" fill="url(#banda)">
  <animate attributeName="x" values="720;1000" dur="3.4s" repeatCount="indefinite"/>
</rect>
</g>
<text class="m" x="869" y="266" text-anchor="middle" font-size="11.5" fill="#4E4E63">escaneando archivos del sitio</text>
</g>
</svg>
